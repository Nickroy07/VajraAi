# Optional: deploy the FastAPI backend to Render (free web service, Docker runtime).
# SQLite lives on the container filesystem — demo data resets on redeploy.
services:
  - type: web
    name: vajra-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: demo
